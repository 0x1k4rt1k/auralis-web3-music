services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: auralis
      POSTGRES_USER: auralis
      POSTGRES_PASSWORD: local-dev-password
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/init.sql:/docker-entrypoint-initdb.d/001-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U auralis -d auralis"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks: [auralis]

  backend:
    build: ./backend
    environment:
      PORT: "3000"
      DATABASE_URL: postgresql://auralis:local-dev-password@postgres:5432/auralis
    depends_on:
      postgres:
        condition: service_healthy
    networks: [auralis]

  frontend:
    build: ./frontend
    depends_on: [backend]
    ports:
      - "8080:8080"
    networks: [auralis]

volumes:
  postgres_data:

networks:
  auralis:
