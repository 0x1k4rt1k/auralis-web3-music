apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres
  namespace: auralis
spec:
  replicas: 1
  selector:
    matchLabels:
      app: postgres
  template:
    metadata:
      labels:
        app: postgres
    spec:
      containers:
        - name: postgres
          image: docker.io/library/postgres:16-alpine
          ports:
            - containerPort: 5432
          env:
            - name: POSTGRES_DB
              value: auralis
            - name: POSTGRES_USER
              value: auralis
            - name: POSTGRES_PASSWORD
              value: auralis-db-password
---
apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: auralis
spec:
  selector:
    app: postgres
  ports:
    - port: 5432
      targetPort: 5432
