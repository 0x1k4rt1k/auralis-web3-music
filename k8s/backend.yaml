apiVersion: apps/v1
kind: Deployment
metadata:
  name: auralis-backend
  namespace: auralis
spec:
  replicas: 1
  selector:
    matchLabels:
      app: auralis-backend
  template:
    metadata:
      labels:
        app: auralis-backend
    spec:
      imagePullSecrets:
        - name: ocir-secret
      containers:
        - name: backend
          image: hyd.ocir.io/axedsxii3ulu/auralis:backend-30
          imagePullPolicy: Always
          ports:
            - containerPort: 3000
          env:
            - name: NODE_ENV
              value: production
            - name: PORT
              value: "3000"
            - name: DATABASE_URL
              value: postgresql://auralis:auralis-db-password@postgres:5432/auralis
---
apiVersion: v1
kind: Service
metadata:
  name: auralis-backend
  namespace: auralis
  labels:
    app: auralis-backend
spec:
  type: ClusterIP
  selector:
    app: auralis-backend
  ports:
    - name: http
      port: 3000
      targetPort: 3000
