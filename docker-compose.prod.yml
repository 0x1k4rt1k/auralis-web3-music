services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: auralis
      POSTGRES_USER: auralis
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - auralis_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U auralis -d auralis"]
      interval: 5s
      timeout: 5s
      retries: 20
    networks:
      - auralis-internal

  backend:
    image: ${BACKEND_IMAGE}
    restart: unless-stopped
    environment:
      PORT: 3000
      NODE_ENV: production
      DATABASE_URL: postgresql://auralis:${POSTGRES_PASSWORD}@postgres:5432/auralis
      AUDIUS_API_KEY: ${AUDIUS_API_KEY}
      AUDIUS_BEARER_TOKEN: ${AUDIUS_BEARER_TOKEN}
    depends_on:
      postgres:
        condition: service_healthy
    expose:
      - "3000"
    networks:
      - auralis-internal
      - auralis-public
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\""]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s

  frontend:
    image: ${FRONTEND_IMAGE}
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "8080:8080"
    networks:
      - auralis-public

networks:
  auralis-internal:
    driver: bridge
    internal: true
  auralis-public:
    driver: bridge

volumes:
  auralis_postgres_data:
